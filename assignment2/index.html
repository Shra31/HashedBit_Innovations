<!DOCTYPE html>
<html>
<head>
    <title>JS Assignment 2</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background-color: #f4f6f9;
        }
        .box {
            background: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        h3 {
            color: #2a5298;
            margin-bottom: 10px;
        }
        p {
            margin: 4px 0;
        }
    </style>
</head>
<body>

<h2>JS Assignment 2 - Output</h2>
<div id="output"></div>

<script>

let output = document.getElementById("output");

function display(question, input, result) {
    output.innerHTML += `
        <div class="box">
            <h3>${question}</h3>
            <p><strong>Input:</strong> ${input}</p>
            <p><strong>Output:</strong> ${result}</p>
        </div>
    `;
}

// ===============================
// Q1: Even numbers from 1 to 100
// ===============================

let evenNumbers = [];
for (let i = 1; i <= 100; i++) {
    if (i % 2 === 0) {
        evenNumbers.push(i);
    }
}
display(
    "Q1: Display even numbers from 1 to 100",
    "Range: 1 to 100",
    evenNumbers.join(", ")
);


// ===============================
// Q2: Calculator using switch
// ===============================

function calculate(num1, num2, operator) {
    switch (operator) {
        case "+": return num1 + num2;
        case "-": return num1 - num2;
        case "*": return num1 * num2;
        case "/": return num2 !== 0 ? num1 / num2 : "Cannot divide by zero";
        default: return "Invalid operator";
    }
}

display(
    "Q2: Calculator using switch",
    "10 + 5",
    calculate(10,5,"+")
);

display(
    "Q2: Calculator using switch",
    "10 * 5",
    calculate(10,5,"*")
);


// ===============================
// Q3: Tax calculation
// ===============================

function findTax(salary) {
    let tax = 0;

    switch (true) {
        case (salary > 0 && salary <= 500000):
            tax = 0;
            break;
        case (salary > 500000 && salary <= 1000000):
            tax = salary * 0.10;
            break;
        case (salary > 1000000 && salary <= 1500000):
            tax = salary * 0.20;
            break;
        case (salary > 1500000):
            tax = salary * 0.30;
            break;
        default:
            tax = "Invalid salary";
    }

    return tax;
}

display(
    "Q3: Tax Calculation",
    "Salary: 800000",
    "Tax: " + findTax(800000)
);


// ===============================
// Q4: Sum of product of corresponding digits
// ===============================

function sumOfDigitProducts(n1, n2) {
    let num1 = n1.toString();
    let num2 = n2.toString();

    let maxLength = Math.max(num1.length, num2.length);
    num1 = num1.padStart(maxLength, "0");
    num2 = num2.padStart(maxLength, "0");

    let sum = 0;

    for (let i = 0; i < maxLength; i++) {
        sum += Number(num1[i]) * Number(num2[i]);
    }

    return sum;
}

display(
    "Q4: Sum of product of corresponding digits",
    "n1 = 6, n2 = 34",
    sumOfDigitProducts(6,34)
);

</script>

</body>
</html>
